{% extends 'base.html' %}

{% block content %}
{% if recipes %}
{% for recipe in recipes %}
    <ul>
        
        <li>
            <div id="recipe-{{ recipe.id }}">
        <h1 ><a href="{% url 'recipe_detail' recipe.id %}">{{ recipe.title }}</a></h1>
        <p>{{ recipe.description }}</p>
        <p><strong>Servings:</strong> {{ recipe.number_of_servings }}</p>
        <small>{{ recipe.created_at }}</small>
          <button onclick="deleteRecipe({{ recipe.id }})">Delete</button>
        </div>
        </li>
          
    </ul>
{% endfor %}
{% else %}
    <p>no recipes</p>
{% endif %}

<script>
function deleteRecipe(recipeId) {
    if (!confirm("Are you sure you want to delete this recipe?")) {
        return;
    }

    fetch(`/recipe/delete/${recipeId}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest"
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            document.getElementById(`recipe-${recipeId}`).remove();
        } else {
            alert("Delete failed");
        }
    });
}
</script>

{% endblock %}
