{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cookbook{% endblock %}</title>

    <!-- Google Fonts for SavoryWise Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Base Styles -->
    <link rel="stylesheet" href="{% static 'Recipe/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Vertical Sidebar -->
    <nav class="sidebar">
        <!-- Logo -->
        <a href="{% url 'home_feed' %}" class="sidebar-logo">
            S<span>W</span>
        </a>

        <!-- Main Links -->
        <div class="sidebar-links">
            <!-- Explore -->
            <a href="{% url 'home_feed' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'home_feed' %}active{% endif %}"
                data-tooltip="Explore Recipes">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </a>

            <!-- Write Recipe -->
            <a href="{% url 'create_recipe' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'create_recipe' %}active{% endif %}"
                data-tooltip="Write Recipe">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z" />
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                    <path d="M2 2l7.586 7.586" />
                    <circle cx="11" cy="11" r="2" />
                </svg>
            </a>

            <!-- My Cookbooks -->
            {% if user.is_authenticated %}
            <a href="{% url 'my_cookbooks' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'my_cookbooks' %}active{% endif %}"
                data-tooltip="My Cookbooks">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
                </svg>
            </a>

            <!-- Favorites -->
            <a href="{% url 'favorite_recipes' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'favorite_recipes' %}active{% endif %}"
                data-tooltip="Favorites">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                </svg>
            </a>

            <!-- Notifications -->
            <a href="{% url 'notifications' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}"
                data-tooltip="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
            </a>
            {% endif %}
        </div>

        <!-- User Actions (Bottom) -->
        <div class="sidebar-links sidebar-bottom">
            <a href="{% url 'admin_login' %}"
                class="sidebar-link {% if request.resolver_match.url_name == 'admin_login' or request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"
                data-tooltip="Admin Portal">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
            </a>

            {% if user.is_authenticated %}

            <a href="{% url 'logout' %}" class="sidebar-link" data-tooltip="Logout ({{ user.username }})">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="sidebar-link" data-tooltip="Login">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
            </a>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content wrapper to offset from sidebar -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'Recipe/js/heading_hover.js' %}"></script>
</body>

</html>
